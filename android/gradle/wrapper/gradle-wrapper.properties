distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 8.13 is the minimum the Android Gradle Plugin (8.12.0) accepts. This was
# downgraded to 8.8 for Java 11 on Appflow; the Java target has since moved to
# 17, so the downgrade only left the build unable to configure ':app' at all:
#   Failed to apply plugin 'com.android.internal.version-check'.
#   > Minimum supported Gradle version is 8.13. Current version is 8.8.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
